name: generate pacman contribution graph

on:
  schedule:
    - cron: "0 0,12 * * *"   # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pac-Man graph (light)
        uses: Kefranabg/readme-pacman@v1
        with:
          github_user_name: raghunath485
          theme: light
          outputs: dist/pacman-light.svg

      - name: Generate Pac-Man graph (dark)
        uses: Kefranabg/readme-pacman@v1
        with:
          github_user_name: raghunath485
          theme: dark
          outputs: dist/pacman-dark.svg

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
