name: Github Profile Snake

on:
  generate:
    schedule:
      - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-profile-snake:
    run-name: Generate the github-profile-snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: JamesIves/github-profile-snake@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
